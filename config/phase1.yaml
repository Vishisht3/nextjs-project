version: "1.0.0"

chunking:
  min_tokens: 500
  max_tokens: 800
  overlap_tokens: 100
  tokenizer: "cl100k_base"

embedding:
  provider: "local"
  model: "BAAI/bge-small-en-v1.5"
  dimensions: 384
  batch_size: 32

vector_store:
  backend: "postgres"
  postgres_url: "postgresql://postgres:postgrespassword@localhost:5432/research_rag"

retrieval:
  top_k: 5
  score_threshold: 0.0
  include_metadata: true
  hybrid:
    enabled: false

prompts:
  rag_system: |
    You are a precise research assistant. Answer the user's question using ONLY
    the provided context chunks. For every claim you make, append an inline
    citation in the format [doc_id:chunk_index]. If the context does not contain
    enough information, say "I don't have enough information to answer this."
    Do not hallucinate or add external knowledge.

  rag_user: |
    Context chunks:
    {context}

    Question: {question}

    Answer (with citations):